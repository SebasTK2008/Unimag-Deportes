name: Keep Render Backend Alive

on:
  schedule:
    # Cada 5 minutos en UTC, evitando el minuto 0 de mayor carga en GitHub.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Comprobar liveness de Render
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Validar URL configurada
        shell: bash
        run: |
          if [[ -z "$RENDER_HEALTH_URL" ]]; then
            echo "::error::Configura RENDER_HEALTH_URL en Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [[ "$RENDER_HEALTH_URL" != https://* ]]; then
            echo "::error::RENDER_HEALTH_URL debe utilizar HTTPS."
            exit 1
          fi

      - name: Ping Health Endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --proto '=https' \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --retry-max-time 150 \
            --output /dev/null \
            --url "$RENDER_HEALTH_URL"
