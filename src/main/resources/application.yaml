spring:
  application:
    name: demo
  datasource:
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
  lifecycle:
    timeout-per-shutdown-phase: 5s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:false}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: America/Bogota
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 64MB

# Spring Boot reads SPRING_DATASOURCE_URL/USERNAME/PASSWORD outside Compose.
# Keep forwarded headers disabled unless a trusted reverse proxy is configured.
server:
  port: ${PORT:8080}
  request:
    header:
      forwarded:
        strategy: none

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false

app:
  storage:
    max-image-pixels: ${APP_STORAGE_MAX_IMAGE_PIXELS:64000000}
    max-image-dimension: ${APP_STORAGE_MAX_IMAGE_DIMENSION:16384}
    supabase:
      url: ${APP_STORAGE_SUPABASE_URL:}
      bucket: ${APP_STORAGE_SUPABASE_BUCKET:space-images}
      key: ${APP_STORAGE_SUPABASE_KEY:}
      timeout: ${APP_STORAGE_SUPABASE_TIMEOUT:PT1M}
  checkin:
    frontend-origin: ${APP_CHECKIN_FRONTEND_ORIGIN:}
  mail:
    from: ${APP_MAIL_FROM:}
    contact-url: ${APP_MAIL_CONTACT_URL:}
    contact-recipient: ${APP_MAIL_CONTACT_RECIPIENT:}
    cancellation-url: ${APP_MAIL_CANCELLATION_URL:}
  rules:
    booking-tolerance-minutes: ${APP_RULES_BOOKING_TOLERANCE_MINUTES:10}
    late-cancellation-minutes: ${APP_RULES_LATE_CANCELLATION_MINUTES:60}
    min-advance-minutes: ${APP_RULES_MIN_ADVANCE_MINUTES:0}
    checkin-opening-minutes: ${APP_RULES_CHECKIN_OPENING_MINUTES:10}
    suspension-days: ${APP_RULES_SUSPENSION_DAYS:7}
  jobs:
    storage-cleanup-cron: ${APP_JOBS_STORAGE_CLEANUP_CRON:0 */5 * * * *}
    auth-cleanup-cron: ${APP_JOBS_AUTH_CLEANUP_CRON:0 0 * * * *}
    reminder-cron: ${APP_JOBS_REMINDER_CRON:0 * * * * *}
    reservation-lifecycle-cron: ${APP_JOBS_RESERVATION_LIFECYCLE_CRON:0 * * * * *}
  auth:
    jwt:
      secret: ${APP_AUTH_JWT_SECRET}
    code:
      hmac-secret: ${APP_AUTH_CODE_HMAC_SECRET}
      validity: ${APP_AUTH_CODE_VALIDITY:PT15M}
      max-attempts: ${APP_AUTH_CODE_MAX_ATTEMPTS:5}
      resend-interval: ${APP_AUTH_CODE_RESEND_INTERVAL:PT1M}
      max-requests-per-email: ${APP_AUTH_CODE_MAX_REQUESTS_PER_EMAIL:5}
    admin-emails: ${APP_AUTH_ADMIN_EMAILS:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
