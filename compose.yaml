services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

  app:
    build: .
    stop_grace_period: 30s
    profiles: ["app"]
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mydatabase}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-myuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_SMTP_STARTTLS_REQUIRED:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:-}
      APP_STORAGE_SUPABASE_URL: ${APP_STORAGE_SUPABASE_URL:-}
      APP_STORAGE_SUPABASE_BUCKET: ${APP_STORAGE_SUPABASE_BUCKET:-space-images}
      APP_STORAGE_SUPABASE_KEY: ${APP_STORAGE_SUPABASE_KEY:-}
      APP_STORAGE_SUPABASE_TIMEOUT: ${APP_STORAGE_SUPABASE_TIMEOUT:-PT1M}
      APP_STORAGE_MAX_IMAGE_PIXELS: ${APP_STORAGE_MAX_IMAGE_PIXELS:-64000000}
      APP_STORAGE_MAX_IMAGE_DIMENSION: ${APP_STORAGE_MAX_IMAGE_DIMENSION:-16384}
      APP_JOBS_STORAGE_CLEANUP_CRON: ${APP_JOBS_STORAGE_CLEANUP_CRON:-0 */5 * * * *}
      APP_AUTH_CODE_HMAC_SECRET: ${APP_AUTH_CODE_HMAC_SECRET:-}
      APP_AUTH_CODE_VALIDITY: ${APP_AUTH_CODE_VALIDITY:-PT15M}
      APP_AUTH_CODE_MAX_ATTEMPTS: ${APP_AUTH_CODE_MAX_ATTEMPTS:-5}
      APP_AUTH_CODE_RESEND_INTERVAL: ${APP_AUTH_CODE_RESEND_INTERVAL:-PT1M}
      APP_AUTH_CODE_MAX_REQUESTS_PER_EMAIL: ${APP_AUTH_CODE_MAX_REQUESTS_PER_EMAIL:-5}
      APP_AUTH_ADMIN_EMAILS: ${APP_AUTH_ADMIN_EMAILS:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_CHECKIN_FRONTEND_ORIGIN: ${APP_CHECKIN_FRONTEND_ORIGIN:-}
      APP_MAIL_CONTACT_URL: ${APP_MAIL_CONTACT_URL:-}
      APP_MAIL_CONTACT_RECIPIENT: ${APP_MAIL_CONTACT_RECIPIENT:-}
      APP_MAIL_CANCELLATION_URL: ${APP_MAIL_CANCELLATION_URL:-}
      APP_RULES_BOOKING_TOLERANCE_MINUTES: ${APP_RULES_BOOKING_TOLERANCE_MINUTES:-10}
      APP_RULES_LATE_CANCELLATION_MINUTES: ${APP_RULES_LATE_CANCELLATION_MINUTES:-60}
      APP_RULES_MIN_ADVANCE_MINUTES: ${APP_RULES_MIN_ADVANCE_MINUTES:-0}
      APP_RULES_CHECKIN_OPENING_MINUTES: ${APP_RULES_CHECKIN_OPENING_MINUTES:-10}
      APP_RULES_SUSPENSION_DAYS: ${APP_RULES_SUSPENSION_DAYS:-7}
      APP_JOBS_RESERVATION_LIFECYCLE_CRON: ${APP_JOBS_RESERVATION_LIFECYCLE_CRON:-0 * * * * *}
      APP_JOBS_REMINDER_CRON: ${APP_JOBS_REMINDER_CRON:-0 * * * * *}
      APP_JOBS_AUTH_CLEANUP_CRON: ${APP_JOBS_AUTH_CLEANUP_CRON:-0 0 * * * *}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres-data:
