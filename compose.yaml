services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

  app:
    build: .
    profiles: ["app"]
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mydatabase}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-myuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:-}
      APP_AUTH_CODE_HMAC_SECRET: ${APP_AUTH_CODE_HMAC_SECRET:-}
      APP_AUTH_CODE_VALIDITY: ${APP_AUTH_CODE_VALIDITY:-PT15M}
      APP_AUTH_CODE_MAX_ATTEMPTS: ${APP_AUTH_CODE_MAX_ATTEMPTS:-5}
      APP_AUTH_ADMIN_EMAILS: ${APP_AUTH_ADMIN_EMAILS:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_CHECKIN_FRONTEND_ORIGIN: ${APP_CHECKIN_FRONTEND_ORIGIN:-}
      APP_MAIL_CONTACT_URL: ${APP_MAIL_CONTACT_URL:-}
      APP_MAIL_CONTACT_RECIPIENT: ${APP_MAIL_CONTACT_RECIPIENT:-}
      APP_MAIL_CANCELLATION_URL: ${APP_MAIL_CANCELLATION_URL:-}
      APP_RULES_BOOKING_TOLERANCE_MINUTES: ${APP_RULES_BOOKING_TOLERANCE_MINUTES:-10}
      APP_RULES_LATE_CANCELLATION_MINUTES: ${APP_RULES_LATE_CANCELLATION_MINUTES:-60}
      APP_RULES_MIN_ADVANCE_MINUTES: ${APP_RULES_MIN_ADVANCE_MINUTES:-0}
      APP_RULES_CHECKIN_OPENING_MINUTES: ${APP_RULES_CHECKIN_OPENING_MINUTES:-10}
      APP_RULES_SUSPENSION_DAYS: ${APP_RULES_SUSPENSION_DAYS:-7}
      APP_JOBS_RESERVATION_LIFECYCLE_CRON: ${APP_JOBS_RESERVATION_LIFECYCLE_CRON:-0 * * * * *}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres-data:
